# Names to always redact (and propagate), even where no detector fires.
deny_list: []

# Internal identifier formats. Each becomes an L1 rule: name, entity (category), pattern, score.
# OCR glues neighbours on ("EMP-41877sV", "EMP-41077IAM"), so there is no trailing \b; O/I/l read
# for 0/1 are tolerated inside the number, but an ID must end on a real digit unless nothing
# alphanumeric follows.
id_patterns:
  - name: cadence_person_id
    entity: EMPLOYEE_ID
    pattern: '(?<![0-9])(?:EMP|DIR|STF|CON|USR)-(?:[0-9OIl]{2,6}[0-9]|[0-9OIl]{3,7}(?![0-9A-Za-z]))'
    score: 0.88
  - name: cadence_vendor_id
    entity: VENDOR_ID
    pattern: '(?<![0-9])(?:MER|VEN|SUP)-[A-Z]{2}-(?:[0-9OIl]{2,6}[0-9]|[0-9OIl]{3,7}(?![0-9A-Za-z]))'
    score: 0.80
