name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Windows: the platform the held-out numbers and fixture floors were measured on.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies (includes en_core_web_lg)
        run: python -m pip install -r requirements.txt

      - name: Lint (syntax errors, undefined names, unused imports)
        run: python -m ruff check .

      - name: Known vulnerabilities in the pinned dependencies
        run: python -m pip_audit --no-deps --disable-pip -r requirements.txt

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('optiv_pii_shield/modelstore.py') }}

      - name: Fetch models (OCR, face detection; SHA-256 checked; no document data involved)
        run: python scripts/fetch_models.py

      - name: Verify models import (exit codes alone have hidden failed downloads before)
        run: python -c "import en_core_web_lg, rapidocr_onnxruntime; from optiv_pii_shield import modelstore as m; [m.locate(x) for x in m.ALL]; print('models ok')"

      - name: Tests (fixtures, planted leaks, held-out set, verification, review, audit chain, server, offline guard)
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Known vulnerabilities in the dashboard's runtime dependencies
        run: npm audit --omit=dev

      - name: Type-check and build
        run: npm run build
