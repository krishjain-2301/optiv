name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Windows: the platform the held-out numbers and fixture floors were measured on.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies (includes en_core_web_lg)
        run: python -m pip install -r requirements.txt

      - name: Cache OCR model
        uses: actions/cache@v4
        with:
          path: models/en_PP-OCRv3_rec_infer.onnx
          key: ocr-en-PP-OCRv3-rec

      - name: Fetch OCR model (one-time 9 MB download; no document data involved)
        run: python scripts/fetch_models.py

      - name: Verify models import (exit codes alone have hidden failed downloads before)
        run: python -c "import en_core_web_lg, rapidocr_onnxruntime; print('models ok')"

      - name: Tests (fixtures, planted leaks, held-out set, xlsx, ops)
        run: python -m pytest -q
